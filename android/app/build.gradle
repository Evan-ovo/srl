apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

def buildInfo = new JsonSlurper().parse(rootProject.file('../build-info.json'))
def publicReleaseConfig = new JsonSlurper().parse(rootProject.file('../public-release.config.json'))
def updateRepository = (System.getenv('SRL_APK_UPDATE_REPOSITORY') ?: publicReleaseConfig.repository).trim()
if (!(updateRepository ==~ /[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+/)) throw new GradleException('APK 更新仓库必须是 owner/repo')
def publicAssetOrigin = (System.getenv('SRL_PUBLIC_ASSET_ORIGIN') ?: '').trim()
if (publicAssetOrigin) {
    def assetUri = new URI(publicAssetOrigin)
    if (assetUri.scheme != 'https' || !assetUri.host || assetUri.userInfo || assetUri.port != -1 ||
        (assetUri.path && assetUri.path != '/') || assetUri.query || assetUri.fragment) {
        throw new GradleException('SRL_PUBLIC_ASSET_ORIGIN 必须是无端口、路径、凭据或查询参数的 HTTPS 站点来源。')
    }
    publicAssetOrigin = assetUri.toString().replaceAll('/+$', '')
}

def releaseSigningValues = [
    storeFile: System.getenv('SRL_ANDROID_RELEASE_STORE_FILE'),
    storePassword: System.getenv('SRL_ANDROID_RELEASE_STORE_PASSWORD'),
    keyAlias: System.getenv('SRL_ANDROID_RELEASE_KEY_ALIAS'),
    keyPassword: System.getenv('SRL_ANDROID_RELEASE_KEY_PASSWORD'),
]

def isReleaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}

if (isReleaseBuildRequested && releaseSigningValues.values().any { !it }) {
    throw new GradleException(
        'Release 构建需要 SRL_ANDROID_RELEASE_STORE_FILE、SRL_ANDROID_RELEASE_STORE_PASSWORD、' +
        'SRL_ANDROID_RELEASE_KEY_ALIAS 和 SRL_ANDROID_RELEASE_KEY_PASSWORD 环境变量。'
    )
}

android {
    namespace = "buzz.jixiangruyi1207.srl"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.srl.publicedition"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildInfo.androidVersionCode as int
        versionName buildInfo.androidVersionName as String
        buildConfigField 'int', 'SRL_NATIVE_API_VERSION', buildInfo.nativeApiVersion.toString()
        buildConfigField 'String', 'SRL_BUILD_ID', '"' + buildInfo.buildId + '"'
        buildConfigField 'String', 'SRL_APK_UPDATE_REPOSITORY', groovy.json.JsonOutput.toJson(updateRepository)
        buildConfigField 'String', 'SRL_PUBLIC_ASSET_ORIGIN', groovy.json.JsonOutput.toJson(publicAssetOrigin)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        release {
            storeFile file(releaseSigningValues.storeFile ?: '.')
            storePassword releaseSigningValues.storePassword
            keyAlias releaseSigningValues.keyAlias
            keyPassword releaseSigningValues.keyPassword
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20250517'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
